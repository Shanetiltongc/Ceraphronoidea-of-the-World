# Taxon page panel layout
# Nomenclature is the timeline in panels/PanelNames (id panel:nomenclature).
# Statistics is the external-links panel in panels/PanelExternal (id panel:statistics).

taxa_page:
  overview:
    panels:
      - - - 'panel:type-specimen'
          - 'panel:gallery'
          - 'panel:type'
          - 'panel:nomenclature'

        - - 'panel:map'
          - 'panel:statistics'
          - 'panel:descendants'
          - 'panel:content'
          - 'panel:keys'
          - 'panel:sounds'

      - - - 'panel:biological-association-graphs'
